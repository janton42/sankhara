name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install headless display and GL libraries for Kivy
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libegl1 libmtdev1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: xvfb-run -a uv run pytest
